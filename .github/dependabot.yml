version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      lint-and-format:
        dependency-type: development
        patterns:
          - '@eslint/*'
          - eslint
          - 'eslint-*'
          - globals
          - prettier
          - typescript-eslint
        update-types:
          - minor
          - patch
      unit-test-tooling:
        dependency-type: development
        patterns:
          - '@testing-library/*'
          - jsdom
          - vitest
        update-types:
          - minor
          - patch
